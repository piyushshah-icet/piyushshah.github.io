<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#10203a"/>
    </linearGradient>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg4)"/>
  <g stroke="#1d3354" stroke-width="1" opacity="0.5">
    <path d="M0 90 H800 M0 180 H800 M0 270 H800 M0 360 H800"/>
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450"/>
  </g>

  <!-- SFC chain -->
  <g font-size="12" fill="#e8eefb" text-anchor="middle">
    <rect x="90" y="60" width="150" height="44" rx="6" fill="#10243f" stroke="#2dd4bf" stroke-width="2.5"/>
    <rect x="96" y="66" width="138" height="32" rx="4" fill="none" stroke="#2dd4bf" stroke-width="1"/>
    <text x="165" y="87">S1 · IDLE</text>

    <path d="M165 104 V134" stroke="#60a5fa" stroke-width="2"/>
    <path d="M150 119 H180" stroke="#60a5fa" stroke-width="3"/>
    <text x="195" y="124" fill="#8fa6c6" font-size="10" text-anchor="start">VEHICLE DETECTED</text>

    <rect x="90" y="134" width="150" height="44" rx="6" fill="#10243f" stroke="#3b5d8f" stroke-width="2"/>
    <text x="165" y="161">S2 · ISSUE TICKET</text>

    <path d="M165 178 V208" stroke="#60a5fa" stroke-width="2"/>
    <path d="M150 193 H180" stroke="#60a5fa" stroke-width="3"/>
    <text x="195" y="198" fill="#8fa6c6" font-size="10" text-anchor="start">TICKET TAKEN</text>

    <rect x="90" y="208" width="150" height="44" rx="6" fill="#10243f" stroke="#3b5d8f" stroke-width="2"/>
    <text x="165" y="235">S3 · RAISE BARRIER</text>

    <path d="M165 252 V282" stroke="#60a5fa" stroke-width="2"/>
    <path d="M150 267 H180" stroke="#60a5fa" stroke-width="3"/>
    <text x="195" y="272" fill="#8fa6c6" font-size="10" text-anchor="start">VEHICLE CLEAR</text>

    <rect x="90" y="282" width="150" height="44" rx="6" fill="#10243f" stroke="#3b5d8f" stroke-width="2"/>
    <text x="165" y="309">S4 · LOWER BARRIER</text>

    <path d="M165 326 V346 H60 V82 H86" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#arr4)"/>
  </g>

  <!-- Fault branch -->
  <g font-size="12" fill="#e8eefb" text-anchor="middle">
    <path d="M240 230 H330" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr4)"/>
    <text x="285" y="222" fill="#fb923c" font-size="10">SENSOR FAULT / TIMEOUT</text>
    <rect x="330" y="208" width="150" height="44" rx="6" fill="#241a14" stroke="#fb923c" stroke-width="2"/>
    <text x="405" y="230" fill="#fb923c">FAULT MODE</text>
    <text x="405" y="246" fill="#9fb2cc" font-size="10">ALARM + SAFE STATE</text>
    <rect x="330" y="282" width="150" height="44" rx="6" fill="#10243f" stroke="#3b5d8f" stroke-width="2"/>
    <text x="405" y="309">MAINTENANCE MODE</text>
    <path d="M405 252 V282" stroke="#fb923c" stroke-width="2" marker-end="url(#arr4)"/>
  </g>

  <!-- Gate illustration -->
  <g>
    <rect x="560" y="240" width="34" height="100" rx="6" fill="#0e1b30" stroke="#3b5d8f" stroke-width="2.5"/>
    <circle cx="577" cy="262" r="7" fill="#2dd4bf"/>
    <g transform="rotate(-38 594 262)">
      <rect x="594" y="254" width="150" height="16" rx="8" fill="#10243f" stroke="#2dd4bf" stroke-width="2.5"/>
      <rect x="610" y="257" width="22" height="10" fill="#2dd4bf" opacity="0.8"/>
      <rect x="650" y="257" width="22" height="10" fill="#2dd4bf" opacity="0.8"/>
      <rect x="690" y="257" width="22" height="10" fill="#2dd4bf" opacity="0.8"/>
    </g>
    <path d="M520 340 H780" stroke="#3b5d8f" stroke-width="3"/>
    <text x="650" y="365" fill="#cbd8ee" font-size="12" text-anchor="middle">AUTOMATED PARKING GATE</text>
    <!-- sensor beam -->
    <path d="M620 320 H760" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4 5"/>
    <text x="690" y="312" fill="#8fa6c6" font-size="10" text-anchor="middle">PHOTOEYE</text>
  </g>

  <text x="560" y="120" fill="#cbd8ee" font-size="13" font-weight="600">IEC 61131-3</text>
  <text x="560" y="140" fill="#8fa6c6" font-size="12">SEQUENTIAL FUNCTION CHART</text>
  <text x="560" y="158" fill="#8fa6c6" font-size="12">DETERMINISTIC STATE TRANSITIONS</text>

  <text x="40" y="412" fill="#e8eefb" font-size="22" font-weight="700">SFC Automated Gate Control</text>
  <text x="40" y="434" fill="#2dd4bf" font-size="13" letter-spacing="2">COMPACTLOGIX · STUDIO 5000 · IEC 61131-3 SFC</text>
</svg>
