<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#10203a"/>
    </linearGradient>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>
  <g stroke="#1d3354" stroke-width="1" opacity="0.5">
    <path d="M0 90 H800 M0 180 H800 M0 270 H800 M0 360 H800"/>
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450"/>
  </g>

  <!-- RTD -->
  <g>
    <circle cx="110" cy="195" r="34" fill="#0e1b30" stroke="#2dd4bf" stroke-width="2.5"/>
    <text x="110" y="190" fill="#2dd4bf" font-size="15" text-anchor="middle" font-weight="700">RTD</text>
    <text x="110" y="208" fill="#8fa6c6" font-size="11" text-anchor="middle">PT100</text>
    <text x="110" y="252" fill="#cbd8ee" font-size="12" text-anchor="middle">Ω → ΔV</text>
  </g>

  <!-- Bridge -->
  <g>
    <rect x="190" y="150" width="110" height="90" rx="10" fill="#0e1b30" stroke="#3b5d8f" stroke-width="2"/>
    <path d="M245 165 L275 195 L245 225 L215 195 Z" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <text x="245" y="260" fill="#cbd8ee" font-size="12" text-anchor="middle">BRIDGE</text>
    <path d="M144 195 H190" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arr3)"/>
  </g>

  <!-- In-amp -->
  <g>
    <path d="M340 150 L340 240 L425 195 Z" fill="#10243f" stroke="#2dd4bf" stroke-width="2.5"/>
    <text x="372" y="200" fill="#2dd4bf" font-size="13" text-anchor="middle" font-weight="700">IN-AMP</text>
    <text x="382" y="262" fill="#cbd8ee" font-size="12" text-anchor="middle">INSTRUMENTATION AMP</text>
    <path d="M300 195 H336" stroke="#60a5fa" stroke-width="2" marker-end="url(#arr3)"/>
  </g>

  <!-- V to I -->
  <g>
    <rect x="465" y="155" width="120" height="80" rx="10" fill="#10243f" stroke="#60a5fa" stroke-width="2"/>
    <text x="525" y="188" fill="#e8eefb" font-size="15" text-anchor="middle" font-weight="700">V → I</text>
    <text x="525" y="210" fill="#8fa6c6" font-size="11" text-anchor="middle">TRANSISTOR LOOP DRIVER</text>
    <path d="M425 195 H465" stroke="#60a5fa" stroke-width="2" marker-end="url(#arr3)"/>
  </g>

  <!-- Current loop -->
  <g>
    <rect x="640" y="155" width="110" height="80" rx="10" fill="#0e1b30" stroke="#2dd4bf" stroke-width="2.5"/>
    <text x="695" y="186" fill="#2dd4bf" font-size="17" text-anchor="middle" font-weight="700">4–20 mA</text>
    <text x="695" y="210" fill="#8fa6c6" font-size="11" text-anchor="middle">250 Ω LOAD</text>
    <path d="M585 195 H640" stroke="#60a5fa" stroke-width="2" marker-end="url(#arr3)"/>
  </g>

  <!-- Linear scale graph -->
  <g>
    <rect x="270" y="290" width="260" height="78" rx="8" fill="#0e1b30" stroke="#3b5d8f" stroke-width="1.5"/>
    <path d="M290 352 L510 304" stroke="#2dd4bf" stroke-width="2.5"/>
    <text x="292" y="306" fill="#8fa6c6" font-size="10">20 mA</text>
    <text x="292" y="364" fill="#8fa6c6" font-size="10">4 mA</text>
    <text x="455" y="364" fill="#8fa6c6" font-size="10">TEMP °C</text>
  </g>
  <text x="400" y="282" fill="#cbd8ee" font-size="12" text-anchor="middle">LINEAR OUTPUT: MULTI-POINT CALIBRATION VERIFIED</text>

  <text x="40" y="412" fill="#e8eefb" font-size="22" font-weight="700">RTD Temperature Transmitter</text>
  <text x="40" y="434" fill="#2dd4bf" font-size="13" letter-spacing="2">ANALOG DESIGN · SIGNAL CONDITIONING · CURRENT LOOP</text>
</svg>
