<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#10203a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0d9488" stop-opacity="0.75"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g stroke="#1d3354" stroke-width="1" opacity="0.5">
    <path d="M0 90 H800 M0 180 H800 M0 270 H800 M0 360 H800"/>
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450"/>
  </g>

  <!-- Tank -->
  <g>
    <rect x="90" y="120" width="170" height="220" rx="10" fill="#0e1b30" stroke="#3b5d8f" stroke-width="2.5"/>
    <rect x="96" y="216" width="158" height="118" rx="6" fill="url(#water)"/>
    <path d="M96 220 q20 -8 40 0 t40 0 t40 0 t38 0" stroke="#7ef0dd" stroke-width="2" fill="none"/>
    <text x="175" y="105" fill="#cbd8ee" font-size="15" text-anchor="middle" font-weight="600">WATER TANK</text>
    <!-- inflow pipe -->
    <path d="M40 150 H90" stroke="#3b5d8f" stroke-width="6"/>
    <text x="38" y="138" fill="#8fa6c6" font-size="12">INFLOW</text>
    <!-- outflow -->
    <path d="M260 320 H320" stroke="#3b5d8f" stroke-width="6"/>
  </g>

  <!-- LT transmitter -->
  <circle cx="305" cy="170" r="24" fill="#0e1b30" stroke="#2dd4bf" stroke-width="2"/>
  <text x="305" y="175" fill="#2dd4bf" font-size="14" text-anchor="middle" font-weight="700">LT</text>
  <path d="M260 170 H281" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Outer loop PIDE -->
  <rect x="390" y="120" width="150" height="86" rx="10" fill="#10243f" stroke="#60a5fa" stroke-width="2"/>
  <text x="465" y="152" fill="#e8eefb" font-size="16" text-anchor="middle" font-weight="700">PIDE — LEVEL</text>
  <text x="465" y="176" fill="#8fa6c6" font-size="12" text-anchor="middle">OUTER LOOP (PRIMARY)</text>
  <path d="M329 170 L390 163" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- Inner loop PIDE -->
  <rect x="390" y="260" width="150" height="86" rx="10" fill="#10243f" stroke="#60a5fa" stroke-width="2"/>
  <text x="465" y="292" fill="#e8eefb" font-size="16" text-anchor="middle" font-weight="700">PIDE — FLOW</text>
  <text x="465" y="316" fill="#8fa6c6" font-size="12" text-anchor="middle">INNER LOOP (SECONDARY)</text>
  <path d="M465 206 V260" stroke="#60a5fa" stroke-width="2" marker-end="url(#arr)"/>
  <text x="475" y="238" fill="#8fa6c6" font-size="11">CASCADE SP</text>

  <!-- Valve -->
  <g>
    <path d="M615 285 l26 16 v-32 z M667 285 l-26 16 v-32 z" fill="none" stroke="#2dd4bf" stroke-width="2.5"/>
    <path d="M641 285 V258" stroke="#2dd4bf" stroke-width="2.5"/>
    <path d="M626 258 H656" stroke="#2dd4bf" stroke-width="2.5"/>
    <text x="641" y="330" fill="#cbd8ee" font-size="13" text-anchor="middle">CONTROL VALVE</text>
    <path d="M540 303 H612" stroke="#60a5fa" stroke-width="2" marker-end="url(#arr)"/>
    <text x="552" y="295" fill="#8fa6c6" font-size="11">CV %</text>
  </g>

  <!-- Trend mini-chart -->
  <g>
    <rect x="580" y="90" width="170" height="110" rx="8" fill="#0e1b30" stroke="#3b5d8f" stroke-width="1.5"/>
    <path d="M592 175 L616 150 L638 162 L662 120 L688 134 L712 112 L736 118" stroke="#2dd4bf" stroke-width="2.5" fill="none"/>
    <path d="M592 130 H736" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="665" y="80" fill="#cbd8ee" font-size="12" text-anchor="middle">PV / SP TREND</text>
  </g>

  <!-- Title strip -->
  <text x="40" y="412" fill="#e8eefb" font-size="22" font-weight="700">Cascaded PIDE Level Control</text>
  <text x="40" y="434" fill="#2dd4bf" font-size="13" letter-spacing="2">COMPACTLOGIX · STUDIO 5000 · FACTORYTALK VIEW SE</text>
</svg>
